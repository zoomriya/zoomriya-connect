[workspace]
resolver = "3"
members = [
    "crates/keys",
    "crates/link",
    "crates/punch",
    "crates/proto",
    "crates/tor",
    "crates/ffi",
    "connectd",
    "laptop",
    "laptop/app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/zoomriya/zoomriya-connect"
publish = false

# iroh is pinned to one exact version (docs/architecture.md, "Versions and
# updates"). Upgrade iroh and iroh-base together, every quarter.
[workspace.dependencies]
iroh-base = { version = "=1.4.2", default-features = false, features = ["key"] }
iroh = { version = "=1.4.2", default-features = false, features = ["tls-ring", "metrics"] }

zoomriya-keys = { path = "crates/keys" }
zoomriya-proto = { path = "crates/proto" }
zoomriya-link = { path = "crates/link" }
zoomriya-tor = { path = "crates/tor" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
data-encoding = "2.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
