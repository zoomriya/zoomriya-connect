[workspace]
resolver = "3"
members = [
    "crates/keys",
    "crates/link",
    "crates/punch",
    "crates/proto",
    "crates/ffi",
    "crates/serve",
    "connectd",
    "control-plane",
    "relay",
    "sim/model",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/zoomriya/zoomriya-connect"
publish = false

# iroh is pinned to one exact version (docs/architecture.md, "Versions and
# updates"). Upgrade all three together, every quarter.
[workspace.dependencies]
iroh-base = { version = "=1.4.2", default-features = false, features = ["key"] }
iroh-dns = { version = "=1.4.2" }
iroh = { version = "=1.4.2", default-features = false, features = ["tls-ring", "metrics"] }
iroh-relay = { version = "=1.4.2", features = ["server"] }
iroh-metrics = { version = "1.0.3" }

zoomriya-keys = { path = "crates/keys" }
zoomriya-proto = { path = "crates/proto" }
zoomriya-serve = { path = "crates/serve" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
data-encoding = "2.11"
hickory-server = { version = "0.26.3", default-features = false }
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
tokio-rustls-acme = { version = "0.9" }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
