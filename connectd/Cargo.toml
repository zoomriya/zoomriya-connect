[package]
name = "zoomriya-connectd"
description = "connectd: the box side of Direct+, remote access with no ZOOMRIYA server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zoomriya-connectd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom = "0.3"
hickory-proto = { version = "0.26", default-features = false, features = ["std", "dnssec-ring"] }
if-addrs = "0.15"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
iroh.workspace = true
iroh-relay = { version = "=1.4.2", default-features = false, features = ["server"] }
mdns-sd = "0.22"
portmapper = { version = "0.20", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots = "1"
x509-parser = "0.18"
zoomriya-keys.workspace = true
zoomriya-link.workspace = true
zoomriya-proto.workspace = true
zoomriya-tor.workspace = true

[dev-dependencies]
serde_json.workspace = true
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3"
rcgen = "0.14"

[lints]
workspace = true
