[package]
name = "zoomriya-connectd"
description = "connectd: the box side of ZOOMRIYA Connect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zoomriya-connectd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom = "0.3"
if-addrs = "0.15"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
iroh.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
url = "2"
x509-parser = "0.18"
zoomriya-keys.workspace = true
zoomriya-proto.workspace = true
zoomriya-serve.workspace = true

[dev-dependencies]
serde_json.workspace = true
rcgen = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3"

[lints]
workspace = true
