<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024" role="img" aria-label="The parts of ZOOMRIYA Connect. At the top, three servers, run by ZOOMRIYA or by your family: the control plane, which keeps boxes' signed address records, answers DNS for box names, helps with certificates, checks from outside and passes guests' setup messages, and never carries your data; the relay, which starts each family connection, checks passes, helps with hole punching, carries data only when nothing direct works and is the guests' last resort, and sees who connects but never what; and the guest page, share.zoomriya.net, which serves the page a share link opens and never carries the album. In the middle, the devices: a phone or laptop with the ZOOMRIYA app asks the control plane where the box is and shows its pass to the relay; a guest's browser loads the guest page. The box keeps an always-on connection to the relay. Below, the home router: nothing is opened for the family, because hole punching gets through; the guests' door on port 443 is opened by the box only while a share link is live. At the bottom, the ZOOMRIYA Box: connectd on port 443 checks every device against the paired list and hands family connections to the web server, which is never on the internet, and guests' connections to the read-only album viewer.">
<style>
svg{--surface:#fff;--zone:#f1f5f6;--fg:#15232a;--muted:#5b6c75;--line:#c3ced4;--data:#087f6e;--data-soft:#e4f4f0;--setup:#886516;--setup-soft:#fbf4df;--web:#285db1;--web-soft:#e8effb;--stop:#b3261e}
@media(prefers-color-scheme:dark){svg{--surface:#162026;--zone:#121b20;--fg:#e2eaed;--muted:#93a5ad;--line:#33464f;--data:#56c5ae;--data-soft:#172e2a;--setup:#d8b45c;--setup-soft:#302a19;--web:#86aaf0;--web-soft:#19263c;--stop:#f08c80}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.title{font-size:21px;font-weight:700}.h{font-size:15.5px;font-weight:700}.s{font-size:12.5px}.t{font-size:11.5px}.m{fill:var(--muted)}.b{font-weight:650}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.setup-box{fill:var(--setup-soft);stroke:var(--setup);stroke-width:1.5}
.data-box{fill:var(--data-soft);stroke:var(--data);stroke-width:1.5}
.web-box{fill:var(--web-soft);stroke:var(--web);stroke-width:1.5}
.data{fill:none;stroke:var(--data);stroke-width:4}
.setup{fill:none;stroke:var(--setup);stroke-width:2.5;stroke-dasharray:8 6}
.web{fill:none;stroke:var(--web);stroke-width:2.5;stroke-dasharray:4 5}
.web-solid{fill:none;stroke:var(--web);stroke-width:4}
.c-data{fill:var(--data)}.c-setup{fill:var(--setup)}.c-web{fill:var(--web)}.c-stop{fill:var(--stop)}
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--data)"/></marker>
  <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--setup)"/></marker>
  <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--web)"/></marker>
</defs>
<rect width="900" height="1024" rx="14" fill="var(--surface)"/>

<text x="30" y="40" class="title">ZOOMRIYA Connect: the parts</text>
<text x="30" y="63" class="s m">Green: your data, encrypted end to end · Blue: guests · Gold dashed: finding the box, passes</text>
<text x="30" y="88" class="t b m">SERVERS · ZOOMRIYA'S, OR YOUR OWN</text>

<!-- servers -->
<rect x="30" y="98" width="270" height="140" rx="12" class="setup-box"/>
<text x="46" y="124" class="h">Control plane</text>
<text x="46" y="149" class="s">Address records, signed by each box</text>
<text x="46" y="170" class="s">DNS for box names · certificates</text>
<text x="46" y="191" class="s">Outside check · guests' setup</text>
<text x="46" y="222" class="s b c-setup">Never carries your data</text>

<rect x="315" y="98" width="270" height="140" rx="12" class="setup-box"/>
<text x="331" y="124" class="h">Relay</text>
<text x="331" y="149" class="s">Starts each family connection</text>
<text x="331" y="170" class="s">Checks passes · helps hole punching</text>
<text x="331" y="191" class="s">Carries data if nothing direct works</text>
<text x="331" y="222" class="s b c-setup">Sees who, never what</text>

<rect x="600" y="98" width="270" height="140" rx="12" class="web-box"/>
<text x="616" y="124" class="h">Guest page</text>
<text x="616" y="149" class="mono">share.zoomriya.net</text>
<text x="616" y="170" class="s">The page a share link opens</text>
<text x="616" y="191" class="s">Guests' relay, as a last resort</text>
<text x="616" y="222" class="s b c-web">Never carries the album</text>

<!-- devices to servers -->
<path d="M120 304V242" class="setup" marker-start="url(#s)" marker-end="url(#s)"/>
<text x="130" y="277" class="t c-setup">where's the box?</text>
<path d="M380 304V242" class="setup" marker-start="url(#s)" marker-end="url(#s)"/>
<text x="390" y="277" class="t c-setup">shows its pass</text>
<path d="M735 242V304" class="web" marker-end="url(#w)"/>
<text x="745" y="277" class="t c-web">loads the page</text>

<!-- devices -->
<rect x="30" y="308" width="400" height="130" rx="12" class="data-box"/>
<text x="46" y="335" class="h">Phone or laptop · ZOOMRIYA app</text>
<text x="46" y="360" class="s">Its key, locked in the security chip or key store</text>
<text x="46" y="381" class="s">The link: knows the box's key, holds the pass</text>
<text x="46" y="402" class="s m">On laptops: browser → desktop app → link</text>
<text x="46" y="426" class="s b c-data">Paired · full access</text>

<rect x="600" y="308" width="270" height="130" rx="12" class="web-box"/>
<text x="616" y="335" class="h">Guest · any browser</text>
<text x="616" y="360" class="s">Opens a share link</text>
<text x="616" y="381" class="s">Nothing installed, no account</text>
<text x="616" y="402" class="s m">Checks the box's fingerprint</text>
<text x="616" y="426" class="s b c-web">One album · read only</text>

<!-- home router -->
<rect x="20" y="490" width="860" height="56" rx="10" class="zone"/>
<text x="36" y="523" class="b">Home router</text>
<text x="212" y="512" class="s c-data">nothing opened for the family:</text>
<text x="212" y="532" class="s c-data">hole punching gets through</text>
<text x="530" y="512" class="s c-web">guests' door, port 443,</text>
<text x="530" y="532" class="s c-web">only while a link is live</text>
<text x="747" y="512" class="t m">UPnP, NAT-PMP,</text>
<text x="747" y="532" class="t m">PCP or IPv6</text>

<!-- the box -->
<rect x="20" y="562" width="860" height="420" rx="12" class="zone"/>
<text x="36" y="588" class="h">ZOOMRIYA Box</text>

<!-- box <-> relay, always on -->
<path d="M515 242V614" class="setup" marker-start="url(#s)" marker-end="url(#s)"/>
<text x="525" y="376" class="t c-setup">always on:</text>
<text x="525" y="392" class="t c-setup">box ↔ relay</text>

<!-- devices to the box -->
<path d="M200 442V614" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
<text x="212" y="460" class="t b c-data">direct path, or through the relay</text>
<path d="M735 442V614" class="web-solid" marker-end="url(#w)"/>
<text x="747" y="460" class="t b c-web">door, WebRTC,</text>
<text x="747" y="475" class="t b c-web">or guests' relay</text>


<rect x="40" y="618" width="820" height="136" rx="10" class="node"/>
<text x="56" y="644" class="h">connectd · port 443</text>
<text x="56" y="669" class="s"><tspan class="b c-data">UDP:</tspan> paired devices only. Checks every device against the box's own list; signs and renews passes</text>
<text x="56" y="692" class="s"><tspan class="b c-web">TCP (HTTPS):</tspan> from home → the web server; from the internet → the album viewer, only while a link is live</text>
<text x="56" y="715" class="s m">Publishes the box's signed address record · gets its certificate and watches the public logs</text>
<text x="56" y="738" class="s m">Opens and closes the guests' door, and asks the control plane to check it from outside</text>

<path d="M240 754V792" class="data" marker-end="url(#d)"/>
<path d="M660 754V792" class="web-solid" marker-end="url(#w)"/>

<rect x="40" y="796" width="400" height="166" rx="10" class="data-box"/>
<text x="56" y="822" class="h">Web server · the box's apps</text>
<text x="56" y="846" class="mono">maplehouse.zoomriya.app</text>
<text x="56" y="870" class="s">The sign-in page and every app</text>
<text x="56" y="892" class="s m">At home, or through the link</text>
<text x="56" y="940" class="s b c-stop">✕ Never on the internet</text>

<rect x="460" y="796" width="400" height="166" rx="10" class="web-box"/>
<text x="476" y="822" class="h">Album viewer · for guests</text>
<text x="476" y="846" class="s">Shows the albums in a link, never changes them</text>
<text x="476" y="870" class="s">Checks the token on every request</text>
<text x="476" y="892" class="s m">Slows down and briefly blocks guessers</text>
<text x="476" y="940" class="s b c-web">One album · read only</text>

<text x="30" y="1008" class="t m">This is the plan: ZOOMRIYA Connect isn't built yet.</text>
</svg>
