<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-label="Phones and laptops with the ZOOMRIYA app reach the box with pinned keys, and connectd hands them to the box's apps. Each connection starts through the relay and moves to a direct path when one works; the relay keeps forwarding encrypted traffic only if none does. Guests open a share link in any browser with nothing installed: over port 443 or by WebRTC hole punching, with a relay as the last option for the encrypted read-only share session. The sign-in page and apps are never on the internet. The control plane only serves the boxes' address records, passes guests' signals, answers DNS and serves the guest page; it carries no family or guest data.">
<style>
svg{--surface:#ffffff;--bg:#f4f6f7;--zone:#eaeff1;--fg:#15232a;--muted:#5b6c75;--line:#c3ced4;--link:#0d7a6b;--web:#2a5cb3;--web-soft:#e3ecfa;--ctl:#8a6a14;--never:#b23a2e}
@media (prefers-color-scheme: dark){svg{--surface:#162026;--bg:#0e1518;--zone:#121b20;--fg:#e2eaed;--muted:#93a5ad;--line:#33464f;--link:#4cc3ae;--web:#7ea8f0;--web-soft:#17243a;--ctl:#d8b45c;--never:#ee7d6f}}
.bg{fill:var(--surface)}
text{fill:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
.t{font-size:17px;font-weight:600}.m{fill:var(--muted)}.s{font-size:13.5px}.b{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.zone{fill:var(--zone);stroke:var(--line)}.box{fill:var(--surface);stroke:var(--line)}
.band{fill:var(--bg);stroke:var(--line);stroke-dasharray:3 4}
.hl-link{fill:var(--surface);stroke:var(--link);stroke-width:2}
.hl-web{fill:var(--web-soft);stroke:var(--web);stroke-width:2}
.a-link{stroke:var(--link);stroke-width:4;fill:none}.a-web{stroke:var(--web);stroke-width:4;fill:none}
.a-ctl{stroke:var(--ctl);stroke-width:2;stroke-dasharray:7 5;fill:none}
.f-link{fill:var(--link)}.f-web{fill:var(--web)}.f-ctl{fill:var(--ctl)}
.c-link{fill:var(--link)}.c-web{fill:var(--web)}.c-ctl{fill:var(--ctl)}.c-never{fill:var(--never)}
</style>
<rect class="bg" width="900" height="1000" rx="12"/>
<defs>
  <marker id="m-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-link"/></marker>
  <marker id="m-web" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-web"/></marker>
  <marker id="m-ctl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ctl"/></marker>
</defs>

<!-- Control plane -->
<rect class="box" x="20" y="20" width="860" height="104" rx="10"/>
<text x="40" y="50" class="t">Control plane · zoomriya.net</text>
<text x="40" y="76" class="m">signed address records · DNS for zoomriya.app · guest page · guest signals</text>
<text x="40" y="104" class="s c-never">coordination only · cannot trust a device · relay is separate</text>

<!-- Control plane to devices -->
<line class="a-ctl" x1="156" y1="128" x2="156" y2="158" marker-start="url(#m-ctl)" marker-end="url(#m-ctl)"/>
<line class="a-ctl" x1="450" y1="128" x2="450" y2="158" marker-start="url(#m-ctl)" marker-end="url(#m-ctl)"/>
<line class="a-ctl" x1="743" y1="128" x2="743" y2="158" marker-start="url(#m-ctl)" marker-end="url(#m-ctl)"/>
<text x="168" y="148" class="s c-ctl">where is the box?</text>
<text x="462" y="148" class="s c-ctl">where is the box?</text>
<text x="755" y="148" class="s c-ctl">guest page</text>

<!-- Devices -->
<rect class="hl-link" x="20" y="162" width="273" height="138" rx="10"/>
<text x="38" y="190" class="t">Phone · ZOOMRIYA app</text>
<text x="38" y="218">web view → proxy → link</text>
<text x="38" y="242" class="m">key locked by the Secure</text>
<text x="38" y="264" class="m">Enclave or Android Keystore</text>
<text x="38" y="288" class="s c-link b">family member · full access</text>

<rect class="hl-link" x="313" y="162" width="273" height="138" rx="10"/>
<text x="331" y="190" class="t">Laptop · desktop app</text>
<text x="331" y="218">any browser → proxy → link</text>
<text x="331" y="242" class="m">key locked by TPM or Keychain</text>
<text x="331" y="264" class="m">starts at sign-in</text>
<text x="331" y="288" class="s c-link b">family member · full access</text>

<rect class="hl-web" x="606" y="162" width="274" height="138" rx="10"/>
<text x="624" y="190" class="t">Guest · any browser</text>
<text x="624" y="218">opens a share link</text>
<text x="624" y="242" class="m">nothing installed</text>
<text x="624" y="264" class="m">no account</text>
<text x="624" y="288" class="s c-web b">one album · READ-ONLY</text>

<!-- Arrow labels -->
<text x="303" y="336" text-anchor="middle" class="s c-link b">the link · relay, then direct</text>
<text x="303" y="356" text-anchor="middle" class="s c-link">pinned keys both ways</text>
<text x="731" y="336" text-anchor="end" class="s c-web b">HTTPS 443 direct,</text>
<text x="731" y="356" text-anchor="end" class="s c-web">or WebRTC hole punch</text>

<!-- Internet -->
<rect class="band" x="20" y="384" width="860" height="52" rx="8"/>
<text x="36" y="416" class="b">Internet</text>
<text x="176" y="416" class="m">relay first · then direct</text>
<text x="470" y="416" class="m">relay forwards encrypted data</text>

<!-- Router -->
<rect class="box" x="20" y="456" width="860" height="72" rx="8"/>
<text x="36" y="486" class="b">Home</text>
<text x="36" y="508" class="b">router</text>
<text x="176" y="486" class="s c-link">apps: nothing opened</text>
<text x="176" y="508" class="s m">hole punching gets through</text>
<text x="470" y="486" class="s c-web">443: opened by the box</text>
<text x="470" y="508" class="s c-web">only while a share link is live</text>
<text x="760" y="486" class="s m">UPnP, PCP</text>
<text x="760" y="508" class="s m">or IPv6</text>

<!-- Home -->
<rect class="zone" x="20" y="548" width="860" height="432" rx="12"/>
<rect class="box" x="34" y="562" width="832" height="404" rx="10"/>
<text x="52" y="590" class="t">ZOOMRIYA box · wired by Ethernet</text>

<!-- connectd -->
<rect class="box" x="50" y="606" width="800" height="120" rx="8"/>
<text x="68" y="634" class="t">connectd · port 443</text>
<text x="68" y="660" class="s c-link">UDP: iroh endpoint · paired devices only · strangers refused</text>
<text x="68" y="684" class="s c-web">TCP 443 (HTTPS) from the internet → the album viewer; paired devices too, if you forwarded it</text>
<text x="68" y="708" class="s m">from the home network → the web server (HTTPS), as usual</text>

<!-- Main paths -->
<line class="a-link" x1="156" y1="300" x2="156" y2="602" marker-end="url(#m-link)"/>
<line class="a-link" x1="450" y1="300" x2="450" y2="602" marker-end="url(#m-link)"/>
<line class="a-web" x1="743" y1="300" x2="743" y2="602" marker-end="url(#m-web)"/>

<!-- Box to control plane -->
<path class="a-ctl" d="M850,640 H872 V72 H884" marker-start="url(#m-ctl)"/>

<!-- connectd to the two servers -->
<line class="a-link" x1="245" y1="726" x2="245" y2="778" marker-end="url(#m-link)"/>
<text x="257" y="758" class="s c-link">links · home</text>
<line class="a-web" x1="655" y1="726" x2="655" y2="778" marker-end="url(#m-web)"/>
<text x="667" y="758" class="s c-web">guests</text>

<!-- Web server and apps -->
<rect class="hl-link" x="50" y="782" width="390" height="166" rx="8"/>
<text x="68" y="810" class="t">Web server · the box's apps</text>
<text x="68" y="836" class="mono">https://x7k2q.zoomriya.app</text>
<text x="68" y="860">one origin, one sign-in</text>
<text x="68" y="884" class="m">at home, or through the link</text>
<text x="68" y="930" class="s c-never b">✕ never on the internet</text>

<!-- Share listener -->
<rect class="hl-web" x="460" y="782" width="390" height="166" rx="8"/>
<text x="478" y="810" class="t">Share listener</text>
<text x="478" y="836">share routes only · GET, HEAD</text>
<text x="478" y="860">token checked on every request</text>
<text x="478" y="884" class="m">rate-limited · no sign-in, no apps</text>
<text x="478" y="930" class="c-web b">one album · READ-ONLY</text>
</svg>
