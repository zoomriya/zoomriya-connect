<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="Pairing a laptop's browser extension, then using it away from home, with option 4. At home, on the home network: an admin picks Add a laptop in Box Desktop, and the box shows a short code that works once, for a few minutes, with a few tries. The family member types the code into the extension. The extension makes its key, which the browser won't let anyone export, and swaps keys with the box over the home network; the code only approves the swap, it is never the key. The box pins the laptop's key, and the extension pins the box's key. Away from home: the extension seals a request for the box and sends it to the family's name on Cloudflare. Cloudflare passes it through the tunnel to the box. The box checks the laptop's key against its own list, refuses replays, opens the request and seals the answer for that laptop. Cloudflare passes the answer back, and the extension checks the box's key and opens it. Cloudflare only ever carries sealed requests and answers. An admin removes a laptop in Box Desktop, and the box refuses it at once. Phones pair as always, by scanning the QR code with the ZOOMRIYA app at home, then go through Cloudflare the same way.">
<style>
svg{--surface:#fff;--zone:#f1f5f6;--fg:#15232a;--muted:#5b6c75;--line:#c3ced4;--data:#087f6e;--data-soft:#e4f4f0;--cf:#b0570f;--cf-soft:#fcefe3;--home:#6a4fb3;--home-soft:#f0ecfa}
@media(prefers-color-scheme:dark){svg{--surface:#162026;--zone:#121b20;--fg:#e2eaed;--muted:#93a5ad;--line:#33464f;--data:#56c5ae;--data-soft:#172e2a;--cf:#f0a465;--cf-soft:#33251a;--home:#b7a2f0;--home-soft:#241f36}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.title{font-size:21px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12.5px}.t{font-size:11.5px}.m{fill:var(--muted)}.b{font-weight:650}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.data-box{fill:var(--data-soft);stroke:var(--data);stroke-width:1.5}
.cf-box{fill:var(--cf-soft);stroke:var(--cf);stroke-width:1.5}
.home-zone{fill:var(--home-soft);stroke:var(--home);stroke-width:1.2}
.away-zone{fill:var(--zone);stroke:var(--line);stroke-width:1.2}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5}
.home{fill:none;stroke:var(--home);stroke-width:2.5}
.data{fill:none;stroke:var(--data);stroke-width:3}
.cf{fill:none;stroke:var(--cf);stroke-width:3}
.c-data{fill:var(--data)}.c-cf{fill:var(--cf)}.c-home{fill:var(--home)}
</style>
<defs>
  <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--home)"/></marker>
  <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--data)"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--cf)"/></marker>
</defs>
<rect width="900" height="900" rx="14" fill="var(--surface)"/>

<text x="30" y="40" class="title">Option 4: pairing a laptop, then using it away</text>
<text x="30" y="63" class="s m">Purple: at home, on the home network · Green: sealed for the other end · Orange: through Cloudflare</text>

<!-- phases -->
<rect x="20" y="132" width="860" height="350" rx="12" class="home-zone"/>
<text x="36" y="156" class="t b c-home">AT HOME, ON THE HOME NETWORK · ONCE PER LAPTOP</text>
<rect x="20" y="496" width="860" height="320" rx="12" class="away-zone"/>
<text x="36" y="520" class="t b m">AWAY FROM HOME · EVERY REQUEST</text>

<!-- lane heads -->
<rect x="40" y="80" width="150" height="40" rx="8" class="node"/>
<text x="115" y="105" text-anchor="middle" class="s b">Family member</text>
<rect x="250" y="80" width="170" height="40" rx="8" class="data-box"/>
<text x="335" y="105" text-anchor="middle" class="s b">ZOOMRIYA extension</text>
<rect x="480" y="80" width="170" height="40" rx="8" class="data-box"/>
<text x="565" y="105" text-anchor="middle" class="s b">ZOOMRIYA Box</text>
<rect x="710" y="80" width="150" height="40" rx="8" class="cf-box"/>
<text x="785" y="105" text-anchor="middle" class="s b">Cloudflare</text>

<!-- lifelines -->
<path d="M115 122V830" class="life"/>
<path d="M335 122V830" class="life"/>
<path d="M565 122V830" class="life"/>
<path d="M785 122V830" class="life"/>

<!-- at home -->
<text x="130" y="182" class="t b">1</text>
<path d="M120 192H558" class="home" marker-end="url(#h)"/>
<text x="140" y="186" class="s">An admin picks <tspan class="b">Add a laptop</tspan> in Box Desktop</text>

<text x="130" y="222" class="t b">2</text>
<path d="M560 232H122" class="home" marker-end="url(#h)"/>
<text x="140" y="226" class="s">Box shows a short code: once, a few minutes, a few tries</text>

<text x="130" y="262" class="t b">3</text>
<path d="M120 272H328" class="home" marker-end="url(#h)"/>
<text x="140" y="266" class="s">Types the code</text>

<rect x="250" y="286" width="170" height="44" rx="8" class="node"/>
<text x="335" y="304" text-anchor="middle" class="t">Makes its key; the browser</text>
<text x="335" y="320" text-anchor="middle" class="t">won't let anyone export it</text>

<text x="350" y="352" class="t b">4</text>
<path d="M340 362H558" class="home" marker-start="url(#h)" marker-end="url(#h)"/>
<text x="366" y="356" class="s">Swap keys, approved by the code</text>
<text x="366" y="378" class="t m">The code only approves the swap. It is never the key</text>

<rect x="480" y="392" width="170" height="44" rx="8" class="node"/>
<text x="565" y="410" text-anchor="middle" class="t">Pins the laptop's key,</text>
<text x="565" y="426" text-anchor="middle" class="t">adds it to its own list</text>
<rect x="250" y="392" width="170" height="44" rx="8" class="node"/>
<text x="335" y="410" text-anchor="middle" class="t">Pins the box's key</text>
<text x="335" y="426" text-anchor="middle" class="t">and its names</text>
<text x="36" y="470" class="t c-home">Pairing never goes through the tunnel.</text>

<!-- away -->
<text x="350" y="548" class="t b">5</text>
<path d="M340 558H778" class="data" marker-end="url(#d)"/>
<text x="366" y="552" class="s">Request, sealed for the box, to <tspan class="b">home.smith.ca</tspan></text>

<text x="580" y="588" class="t b">6</text>
<path d="M780 598H572" class="cf" marker-end="url(#c)"/>
<text x="596" y="592" class="s">Through the tunnel</text>

<rect x="440" y="612" width="250" height="64" rx="8" class="node"/>
<text x="565" y="632" text-anchor="middle" class="t">Checks the laptop's key on its list,</text>
<text x="565" y="648" text-anchor="middle" class="t">refuses replays, opens the request,</text>
<text x="565" y="664" text-anchor="middle" class="t">seals the answer for that laptop</text>

<text x="580" y="700" class="t b">7</text>
<path d="M570 710H778" class="cf" marker-end="url(#c)"/>
<text x="596" y="704" class="s">Sealed answer</text>

<text x="350" y="740" class="t b">8</text>
<path d="M780 750H342" class="data" marker-end="url(#d)"/>
<text x="366" y="744" class="s">Back to the laptop</text>

<rect x="230" y="764" width="210" height="44" rx="8" class="node"/>
<text x="335" y="782" text-anchor="middle" class="t">Checks the box's key,</text>
<text x="335" y="798" text-anchor="middle" class="t">opens the answer</text>

<text x="30" y="852" class="t m">Phones pair as always, by scanning the QR code with the ZOOMRIYA app at home, then go through Cloudflare the same way.</text>
<text x="30" y="872" class="t m">An admin removes a phone or laptop in Box Desktop, and the box refuses it at once. This is a plan: none of it is built yet.</text>
</svg>
