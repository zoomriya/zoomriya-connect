  <rect x="10" y="136" width="206" height="52" rx="8" class="cf-box"/>
  <text x="113" y="158" text-anchor="middle" class="s b">Cloudflare</text>
  <text x="113" y="176" text-anchor="middle" class="t">your account · always in the path</text>
  <path d="M113 190V216" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <rect x="10" y="218" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="243" text-anchor="middle" class="s b">ZOOMRIYA Box · dials out</text>
  <text x="14" y="290" class="t b m">IN THE MIDDLE SEES</text>
  <text x="14" y="308" class="s">Family: who and when</text>
  <text x="14" y="326" class="s b c-stop">Guests: the shared photos</text>
  <text x="14" y="356" class="t b m">LAPTOPS</text>
  <text x="14" y="374" class="s">ZOOMRIYA browser extension</text>
  <text x="14" y="408" class="t b m">PHONES</text>
  <text x="14" y="426" class="s">ZOOMRIYA app, via Cloudflare</text>
  <text x="14" y="460" class="t b m">GUESTS</text>
  <text x="14" y="478" class="s">Always through Cloudflare</text>
  <text x="14" y="512" class="t b m">UPKEEP</text>
  <text x="14" y="530" class="s">Cloudflare account, a domain</text>
</g>

<text x="30" y="670" class="s b c-data">Every option: nothing to set up on the router, everything paired at home, sign-in and apps never on the internet.</text>
<text x="30" y="696" class="t m">This is the plan: none of it is built yet. The laptop extension depends on three checks: see Laptops.</text>
</svg>
