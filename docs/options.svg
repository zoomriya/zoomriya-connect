<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Four ways to reach the box from outside. Option 1, a ZOOMRIYA name such as maplehouse.zoomriya.app: ZOOMRIYA's relay and control plane sit in the middle; devices go direct when they can; the relay sees who connects and when, never what; no upkeep. Option 2, your own domain through ZOOMRIYA, such as home.smith.ca: the same, plus a few DNS records. Option 3, your own ZOOMRIYA Connect server: your own relay and control plane sit in the middle, and ZOOMRIYA plays no part; upkeep is a server of your own. Option 4, your own Cloudflare Tunnel: the box dials out to Cloudflare on your account; phones keep the ZOOMRIYA app, which supports both, and laptops use the same ZOOMRIYA browser extension as in options 1 to 3; everything goes through Cloudflare; Cloudflare sees who connects and when, and can see shared guest albums; upkeep is a Cloudflare account and a domain. In every option the router needs nothing, and the sign-in page and apps are never on the internet.">
<style>
svg{--surface:#fff;--zone:#f1f5f6;--fg:#15232a;--muted:#5b6c75;--line:#c3ced4;--data:#087f6e;--data-soft:#e4f4f0;--setup:#886516;--setup-soft:#fbf4df;--web:#285db1;--web-soft:#e8effb;--cf:#b0570f;--cf-soft:#fcefe3;--stop:#b3261e}
@media(prefers-color-scheme:dark){svg{--surface:#162026;--zone:#121b20;--fg:#e2eaed;--muted:#93a5ad;--line:#33464f;--data:#56c5ae;--data-soft:#172e2a;--setup:#d8b45c;--setup-soft:#302a19;--web:#86aaf0;--web-soft:#19263c;--cf:#f0a465;--cf-soft:#33251a;--stop:#f08c80}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.title{font-size:21px;font-weight:700}.h{font-size:15px;font-weight:700}.s{font-size:12.5px}.t{font-size:11.5px}.m{fill:var(--muted)}.b{font-weight:650}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1.5}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.setup-box{fill:var(--setup-soft);stroke:var(--setup);stroke-width:1.5}
.data-box{fill:var(--data-soft);stroke:var(--data);stroke-width:1.5}
.cf-box{fill:var(--cf-soft);stroke:var(--cf);stroke-width:1.5}
.data{fill:none;stroke:var(--data);stroke-width:3.5}
.data-thin{fill:none;stroke:var(--data);stroke-width:2.5;stroke-dasharray:3 4}
.c-data{fill:var(--data)}.c-setup{fill:var(--setup)}.c-cf{fill:var(--cf)}.c-stop{fill:var(--stop)}
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--data)"/></marker>
</defs>
<rect width="1000" height="720" rx="14" fill="var(--surface)"/>

<text x="30" y="40" class="title">Four ways to reach the box from outside</text>
<text x="30" y="63" class="s m">Options 1–3 are ZOOMRIYA Connect · option 4 leaves ZOOMRIYA out and puts Cloudflare in the middle</text>

<!-- ===== column 1 ===== -->
<g transform="translate(30 84)">
  <rect width="226" height="556" rx="12" class="zone"/>
  <text x="14" y="28" class="h">1 · ZOOMRIYA name</text>
  <text x="14" y="48" class="mono">maplehouse.zoomriya.app</text>
  <rect x="10" y="66" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="91" text-anchor="middle" class="s b">App · laptop extension</text>
  <path d="M130 108V134" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <rect x="44" y="136" width="172" height="52" rx="8" class="setup-box"/>
  <text x="130" y="158" text-anchor="middle" class="s b">ZOOMRIYA's relay</text>
  <text x="130" y="176" text-anchor="middle" class="t">and control plane</text>
  <path d="M130 190V216" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <path d="M24 108V216" class="data-thin" marker-start="url(#d)" marker-end="url(#d)"/>
  <text transform="translate(19 190) rotate(-90)" class="t b c-data">direct</text>
  <rect x="10" y="218" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="243" text-anchor="middle" class="s b">ZOOMRIYA Box</text>
  <text x="14" y="290" class="t b m">IN THE MIDDLE SEES</text>
  <text x="14" y="308" class="s">Who and when, never what</text>
  <text x="14" y="356" class="t b m">LAPTOPS</text>
  <text x="14" y="374" class="s">ZOOMRIYA browser extension</text>
  <text x="14" y="408" class="t b m">PHONES</text>
  <text x="14" y="426" class="s">ZOOMRIYA app</text>
  <text x="14" y="460" class="t b m">GUESTS</text>
  <text x="14" y="478" class="s">Direct, WebRTC, then relay</text>
  <text x="14" y="512" class="t b m">UPKEEP</text>
  <text x="14" y="530" class="s">None</text>
</g>

<!-- ===== column 2 ===== -->
<g transform="translate(268 84)">
  <rect width="226" height="556" rx="12" class="zone"/>
  <text x="14" y="28" class="h">2 · Own domain</text>
  <text x="14" y="48" class="mono">home.smith.ca, via ZOOMRIYA</text>
  <rect x="10" y="66" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="91" text-anchor="middle" class="s b">App · laptop extension</text>
  <path d="M130 108V134" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <rect x="44" y="136" width="172" height="52" rx="8" class="setup-box"/>
  <text x="130" y="158" text-anchor="middle" class="s b">ZOOMRIYA's relay</text>
  <text x="130" y="176" text-anchor="middle" class="t">and control plane</text>
  <path d="M130 190V216" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <path d="M24 108V216" class="data-thin" marker-start="url(#d)" marker-end="url(#d)"/>
  <text transform="translate(19 190) rotate(-90)" class="t b c-data">direct</text>
  <rect x="10" y="218" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="243" text-anchor="middle" class="s b">ZOOMRIYA Box</text>
  <text x="14" y="290" class="t b m">IN THE MIDDLE SEES</text>
  <text x="14" y="308" class="s">Who and when, never what</text>
  <text x="14" y="356" class="t b m">LAPTOPS</text>
  <text x="14" y="374" class="s">ZOOMRIYA browser extension</text>
  <text x="14" y="408" class="t b m">PHONES</text>
  <text x="14" y="426" class="s">ZOOMRIYA app</text>
  <text x="14" y="460" class="t b m">GUESTS</text>
  <text x="14" y="478" class="s">Direct, WebRTC, then relay</text>
  <text x="14" y="512" class="t b m">UPKEEP</text>
  <text x="14" y="530" class="s">An NS record, or four CNAMEs</text>
</g>

<!-- ===== column 3 ===== -->
<g transform="translate(506 84)">
  <rect width="226" height="556" rx="12" class="zone"/>
  <text x="14" y="28" class="h">3 · Own ZOOMRIYA server</text>
  <text x="14" y="48" class="mono">connect.smith.ca</text>
  <rect x="10" y="66" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="91" text-anchor="middle" class="s b">App · laptop extension</text>
  <path d="M130 108V134" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <rect x="44" y="136" width="172" height="52" rx="8" class="setup-box"/>
  <text x="130" y="158" text-anchor="middle" class="s b">Your relay</text>
  <text x="130" y="176" text-anchor="middle" class="t">and control plane</text>
  <path d="M130 190V216" class="data" marker-start="url(#d)" marker-end="url(#d)"/>
  <path d="M24 108V216" class="data-thin" marker-start="url(#d)" marker-end="url(#d)"/>
  <text transform="translate(19 190) rotate(-90)" class="t b c-data">direct</text>
  <rect x="10" y="218" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="243" text-anchor="middle" class="s b">ZOOMRIYA Box</text>
  <text x="14" y="290" class="t b m">IN THE MIDDLE SEES</text>
  <text x="14" y="308" class="s">Your server: who and when</text>
  <text x="14" y="356" class="t b m">LAPTOPS</text>
  <text x="14" y="374" class="s">ZOOMRIYA browser extension</text>
  <text x="14" y="408" class="t b m">PHONES</text>
  <text x="14" y="426" class="s">ZOOMRIYA app</text>
  <text x="14" y="460" class="t b m">GUESTS</text>
  <text x="14" y="478" class="s">Direct, WebRTC, then relay</text>
  <text x="14" y="512" class="t b m">UPKEEP</text>
  <text x="14" y="530" class="s">A server: updates, the bill</text>
</g>

<!-- ===== column 4 ===== -->
<g transform="translate(744 84)">
  <rect width="226" height="556" rx="12" class="zone"/>
  <text x="14" y="28" class="h">4 · Own Cloudflare Tunnel</text>
  <text x="14" y="48" class="mono">home.smith.ca, via Cloudflare</text>
  <rect x="10" y="66" width="206" height="40" rx="8" class="data-box"/>
  <text x="113" y="91" text-anchor="middle" class="s b">App · laptop extension</text>
