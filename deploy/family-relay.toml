# A family's own relay, on its own: "Just a relay" in
# docs/sharing-and-names.md. Copy to /etc/zoomriya-relay/relay.toml, then run
#   zoomriya-relay enrol-code --config /etc/zoomriya-relay/relay.toml
# and type the code into Box Desktop, under ZOOMRIYA Connect.

state_dir = "/var/lib/zoomriya-relay"

[https]
bind = "[::]:443"
cert = { mode = "lets_encrypt", domains = ["relay.smith.ca"], cache_dir = "/var/lib/zoomriya-relay/acme" }

[http]
bind = "[::]:80"

[quic]
bind = "[::]:7842"

[boxes]
source = "enrolled"

# No limits: your relay, your rules.

# The GUI: on this server only. Reach it with ssh -L 8444:127.0.0.1:8444.
# Make a sign-in token with: zoomriya-relay admin-token --config FILE NAME
[admin]
bind = "127.0.0.1:8444"
tokens_file = "/var/lib/zoomriya-relay/admin-tokens"
web_dir = "/usr/share/zoomriya-connect/admin"
