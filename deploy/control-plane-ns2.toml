# The second DNS server, ns2.zoomriya.net, at another hosting company.
# Copy to /etc/zoomriya-control-plane/ns2.toml and run
#   zoomriya-control-plane secondary --config /etc/zoomriya-control-plane/ns2.toml
# It keeps nothing on disk: it answers DNS from a copy of the first server's zone.

primary_url = "https://connect.zoomriya.net"
# One of the keys in the first server's zone-keys file.
key_file = "/etc/zoomriya-control-plane/zone-key"
poll_seconds = 5

# The same names as the first server.
[names]
zone = "zoomriya.app"
address_zone = "dns.zoomriya.net"
control_plane_url = "https://connect.zoomriya.net"
share_url = "https://share.zoomriya.net"
nameservers = ["ns1.zoomriya.net", "ns2.zoomriya.net"]
hostmaster = "hostmaster.zoomriya.net"
certificate_authorities = ["letsencrypt.org", "pki.goog"]

[dns]
bind = "[::]:53"
answers_per_second = 50
