# ZOOMRIYA's control plane. Copy to /etc/zoomriya-control-plane/control-plane.toml.

database = "/var/lib/zoomriya-control-plane/control-plane.sqlite"

[names]
zone = "zoomriya.app"
# Address records in DNS: _iroh.<box key>.dns.zoomriya.net
address_zone = "dns.zoomriya.net"
control_plane_url = "https://connect.zoomriya.net"
share_url = "https://share.zoomriya.net"
# Until the second DNS server is running, ns2 points at this one too.
nameservers = ["ns1.zoomriya.net", "ns2.zoomriya.net"]
hostmaster = "hostmaster.zoomriya.net"
# Only these may issue certificates for box names (CAA).
certificate_authorities = ["letsencrypt.org", "pki.goog"]

[https]
bind = "[::]:443"
# Or: cert = { mode = "files", cert = "/etc/zoomriya-control-plane/cert.pem", key = "/etc/zoomriya-control-plane/key.pem" }
cert = { mode = "lets_encrypt", domains = ["connect.zoomriya.net"], contact = ["mailto:ops@zoomriya.com"], cache_dir = "/var/lib/zoomriya-control-plane/acme" }

[dns]
bind = "[::]:53"
answers_per_second = 50

[relays]
urls = ["https://relay1.zoomriya.net", "https://relay2.zoomriya.net"]
# The control plane to relay keys, one a line (docs/operations.md, "Changing our keys").
keys_file = "/etc/zoomriya-control-plane/relay-keys"

[registration]
per_address_per_day = 10
released_name_days = 90
# Brand names and other words refused in box names, one a line.
blocked_words_file = "/etc/zoomriya-control-plane/blocked-words"
clock_allowance_seconds = 600

# Guests' relay (TURN): one-hour credentials for guests, asked for by boxes.
[guests]
turn_urls = ["turn:turn.zoomriya.net:3478?transport=udp", "turns:turn.zoomriya.net:443?transport=tcp"]
# Shared with the TURN server, one a line, newest first (deploy/turnserver.conf).
turn_secrets_file = "/etc/zoomriya-control-plane/turn-secrets"

# The second DNS server (ns2) copies the zone with one of these keys.
[zone_copy]
keys_file = "/etc/zoomriya-control-plane/zone-keys"

# The GUI: on this server only. Reach it with ssh -L 8444:127.0.0.1:8444.
# Make a sign-in token with: zoomriya-control-plane admin-token --config FILE NAME
[admin]
bind = "127.0.0.1:8444"
tokens_file = "/var/lib/zoomriya-control-plane/admin-tokens"
web_dir = "/usr/share/zoomriya-connect/admin"
