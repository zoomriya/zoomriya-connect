# TURN, on the same server as a relay: the TURN server packaged in Debian 13
# ("coturn"), with these settings in /etc/turnserver.conf. It carries a
# laptop's or a guest's encrypted connection only when WebRTC can't go
# direct (docs/operations.md, "TURN beside a relay").

realm=turn.zoomriya.net
# UDP and TCP 3478, from anywhere. TURN over TLS on port 443 reaches it
# through the relay's front door, which opens the TLS for turn.zoomriya.net
# with the relay's own certificate and passes the stream to TCP 3478 here.
# So coturn needs no certificate and no port 443 of its own.
listening-port=3478
no-tls
no-dtls

# Credentials made with this shared secret: by the relay for laptops
# (/etc/zoomriya-relay/turn-secret) and by the control plane for guests
# (/etc/zoomriya-control-plane/turn-secrets, first line). The same secret in
# all three places.
use-auth-secret
static-auth-secret=CHANGE-ME-the-same-secret-as-the-relay-and-control-plane

# Each session's bytes, by username, which names the box: the relay reads
# this file and reports each box's TURN use (docs/operations.md).
verbose
log-file=/var/log/turnserver/turnserver.log
simple-log

# Never into anyone's private network, nor our own servers.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Add each of our own servers' addresses here, for example:
# denied-peer-ip=203.0.113.10

# Limits: allocations per username (a box's laptops share one, a guest has
# their own), and speed per session.
user-quota=12
total-quota=2000
max-bps=2500000
# Only UDP is relayed: WebRTC needs nothing else.
no-tcp-relay

fingerprint
stale-nonce=600
no-cli
no-software-attribute
