# ZOOMRIYA's relays. Copy to /etc/zoomriya-relay/relay.toml.

# The list of boxes is kept here between restarts.
state_dir = "/var/lib/zoomriya-relay"

[https]
bind = "[::]:443"
# Let's Encrypt over TLS-ALPN on port 443: nothing else to install.
# Or: cert = { mode = "files", cert = "/etc/zoomriya-relay/cert.pem", key = "/etc/zoomriya-relay/key.pem" }
# The certificate covers turn.zoomriya.net too: TURN over TLS on 443 is
# opened here and passed to coturn ([turn] below).
cert = { mode = "lets_encrypt", domains = ["relay1.zoomriya.net", "turn.zoomriya.net"], contact = ["mailto:ops@zoomriya.com"], cache_dir = "/var/lib/zoomriya-relay/acme" }

# Networks with a captive portal are checked over plain HTTP.
[http]
bind = "[::]:80"

# Tells each side its public address, for hole punching.
[quic]
bind = "[::]:7842"

# Our dashboard only: never on the internet.
[metrics]
bind = "127.0.0.1:9090"

[boxes]
source = "control_plane"
url = "https://connect.zoomriya.net"
# The control plane to relay key (docs/operations.md, "Changing our keys").
key_file = "/etc/zoomriya-relay/feed.key"
# Each poll also reports each box's use, for the monthly allowance, which is
# set in the control plane's GUI.
poll_seconds = 10
# This relay's name in the GUI: the name in its address, as in the control
# plane's [relays] urls, so the Servers page puts its outside check beside it.
name = "relay1.zoomriya.net"

[limits]
clock_allowance_seconds = 600
longest_pass_days = 31
# Per connection. The monthly allowance per box is set in the control plane's GUI.
client_bytes_per_second = 4000000

# The GUI: on this server only. Reach it with ssh -L 8444:127.0.0.1:8444.
# Make a sign-in token with: zoomriya-relay admin-token --config FILE NAME
[admin]
bind = "127.0.0.1:8444"
tokens_file = "/var/lib/zoomriya-relay/admin-tokens"
web_dir = "/usr/share/zoomriya-connect/admin"

# TURN beside this relay (coturn, deploy/turnserver.conf), for laptops whose
# WebRTC can't go direct (docs/operations.md, "TURN beside a relay").
[turn]
# TURN over TLS on port 443 asks for this name; the front door passes it to
# coturn below.
name = "turn.zoomriya.net"
# coturn on this machine, TCP and UDP.
local = "127.0.0.1:3478"
# What laptops are told.
urls = ["turn:turn.zoomriya.net:3478?transport=udp", "turn:turn.zoomriya.net:3478?transport=tcp", "turns:turn.zoomriya.net:443?transport=tcp"]
# The secret shared with coturn's static-auth-secret, one line.
secret_file = "/etc/zoomriya-relay/turn-secret"
# Credentials last a day; laptops get new ones each time they connect.
ttl_seconds = 86400
# coturn's log, for each box's TURN use on the Servers and allowance pages.
log = "/var/log/turnserver/turnserver.log"

# A family's single server: other names on port 443, each passed on unopened
# to the program that answers it here, keeping its own certificate.
# [[pass_through]]
# name = "connect.smith.ca"
# to = "127.0.0.1:8443"
