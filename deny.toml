# cargo-deny: licences, advisories, duplicate crates and sources.

# Only the platforms we build for: the box (Linux), the phone app (iOS,
# Android), the laptop app (Linux, macOS, Windows) and developers' machines. iroh's WebAssembly-only
# dependencies are never built, so they aren't checked.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is marked unmaintained, with no vulnerability. It comes in only
    # through iroh's own relay client code, which we use unchanged so iroh
    # updates stay a version number. Look again when iroh moves off it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; only via iroh" },
    # Through Arti (Tor), the newest release. Look again at each Arti update.
    # rsa: the timing attack needs a private RSA key; Arti only checks relays'
    # RSA signatures with their public keys.
    { id = "RUSTSEC-2023-0071", reason = "private-key timing attack; Arti only verifies with public keys" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, no vulnerability; only via Arti" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained, no vulnerability; only via Arti" },
    # SQLite's stale-memory read needs database files written by someone
    # else; Arti's cache folder is the service's own, mode 0700. Fixed when
    # Arti moves to rusqlite 0.41.
    { id = "RUSTSEC-2026-0459", reason = "local only; Arti's cache folder is private; awaiting Arti's rusqlite 0.41" },
]

[licenses]
version = 2
# Dependency licences permitted by this repository's policy.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 (file-level copyleft, which allows combining with the AGPL) only
# for these, which come in only through Tauri's window, in the laptop app.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # Public-domain-like and permissive, through Arti (Tor) only.
    { allow = ["Unlicense"], crate = "async_executors" },
    { allow = ["CC0-1.0"], crate = "notify" },
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates point at each other by path, and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
