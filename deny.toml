# cargo-deny: licences, advisories, duplicate crates and sources.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences that combine cleanly with MPL-2.0 and the App Store.
# GPL-family licences are left out on purpose (see README).
allow = [
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
