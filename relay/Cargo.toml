[package]
name = "zoomriya-relay"
description = "ZOOMRIYA Connect's relay: iroh's relay library with our check for passes and removed devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zoomriya-relay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom = "0.3"
http.workspace = true
http-body-util = "0.1"
hyper.workspace = true
hyper-util.workspace = true
iroh-metrics = { workspace = true, features = ["service"] }
iroh-relay.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
zoomriya-keys.workspace = true
zoomriya-proto.workspace = true
zoomriya-serve.workspace = true

[dev-dependencies]
iroh-base = { version = "=1.4.2", features = ["relay"] }
iroh-dns.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rcgen = "0.14"
tempfile = "3"

[lints]
workspace = true
