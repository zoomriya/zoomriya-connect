[package]
name = "zoomriya-laptop"
description = "The ZOOMRIYA laptop app's core: pairing, the link, and the box in the laptop's browser at zoomriya.localhost:7480"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zoomriya-laptop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes = "1"
data-encoding.workspace = true
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zoomriya-keys.workspace = true
zoomriya-link.workspace = true
zoomriya-proto.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
